<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Swaad Sadan — Sign in</title>
<style>
:root{--g:#d7b05c;--bg:#090909;--p:#15130f;--l:#3a3226;--m:#aaa294}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 15%,#382913,#090909 55%);color:#f5f0e7;font:15px Arial;display:grid;place-items:center;padding:20px}.box{width:min(430px,100%);background:#11100df5;border:1px solid var(--l);border-radius:14px;padding:34px;box-shadow:0 20px 70px #000}.logo{text-align:center;color:var(--g);font:26px Georgia;letter-spacing:3px}.sub{text-align:center;color:var(--m);line-height:1.6}.field{margin-top:25px}.phone{display:flex;gap:8px}.prefix{width:75px;padding:14px 10px;background:#211c15;border:1px solid var(--l);border-radius:6px;color:#ddd;text-align:center}.phone input,.otp input{flex:1;width:100%;padding:14px;background:#0c0c0c;border:1px solid var(--l);border-radius:6px;color:#fff;font-size:16px;outline:none}.phone input:focus,.otp input:focus{border-color:var(--g)}button{width:100%;padding:14px;margin-top:15px;background:var(--g);border:0;border-radius:6px;font-weight:bold;cursor:pointer}.back{display:block;text-align:center;margin-top:22px;color:#aaa;text-decoration:none}.msg{text-align:center;min-height:22px;color:var(--m);line-height:1.5}.otp{text-align:center}.otp input{letter-spacing:8px;text-align:center;font-size:22px}.hidden{display:none}.small{font-size:12px;color:#777;text-align:center;margin-top:14px}
</style></head><body><main class="box">
<div class="logo">SWAAD SADAN</div><p class="sub">Quick sign in to place and track your order.</p>
<section id="phoneStep"><div class="field"><div class="phone"><span class="prefix">+91</span><input id="phone" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="Mobile number"></div><button id="send">Send OTP</button></div></section>
<section id="otpStep" class="hidden"><p class="sub">Enter the 6-digit OTP sent to <b id="shownPhone"></b></p><div class="otp"><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"></div><button id="verify">Verify & Continue</button><button id="change" style="background:transparent;color:var(--g);border:1px solid var(--l)">Change number</button></section>
<p id="msg" class="msg"></p><p class="small">Your phone number is used only for your Swaad Sadan account and order communication.</p><a class="back" href="index.html">← Back to Swaad Sadan</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script><script>
const sb=window.swaadSupabase;let phone='';
const msg=t=>document.querySelector('#msg').textContent=t;
const normalize=()=>{const n=document.querySelector('#phone').value.replace(/\D/g,'');return n.length===10?'+91'+n:null};
document.querySelector('#send').onclick=async()=>{phone=normalize();if(!phone){msg('Please enter a valid 10-digit mobile number.');return}document.querySelector('#send').disabled=true;msg('Sending OTP…');const r=await sb.auth.signInWithOtp({phone});document.querySelector('#send').disabled=false;if(r.error){msg(r.error.message);return}document.querySelector('#shownPhone').textContent='+'+phone.slice(1,3)+' ••••• '+phone.slice(-2);document.querySelector('#phoneStep').classList.add('hidden');document.querySelector('#otpStep').classList.remove('hidden');msg('OTP sent.');document.querySelector('#otp').focus()};
document.querySelector('#verify').onclick=async()=>{const token=document.querySelector('#otp').value.replace(/\D/g,'');if(token.length!==6){msg('Enter the 6-digit OTP.');return}msg('Verifying…');const r=await sb.auth.verifyOtp({phone,token,type:'sms'});if(r.error){msg(r.error.message);return}location.href='index.html'};
document.querySelector('#change').onclick=()=>{document.querySelector('#otpStep').classList.add('hidden');document.querySelector('#phoneStep').classList.remove('hidden');document.querySelector('#otp').value='';msg('')};
</script></body></html>
