<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swaad Sadan — Sign in</title></head><body><main><h1>Swaad Sadan</h1><h2>Sign in</h2><p>Enter your email and we will send you a secure sign-in link.</p><input id="email" type="email" placeholder="Email"><button id="send">Send sign-in link</button><p id="msg"></p><a href="index.html">Back to hotel</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script><script>document.querySelector("#send").onclick=async()=>{const email=document.querySelector("#email").value.trim();if(!email)return;const r=await window.swaadSupabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname.replace("auth.html","index.html")}});document.querySelector("#msg").textContent=r.error?r.error.message:"Check your email for the secure sign-in link.";};</script></body></html>
